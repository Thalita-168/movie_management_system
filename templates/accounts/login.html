<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Movie Booking</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <!-- Removed all Django template tags, converted to pure HTML -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="/movies/">Movie Booking</a>
            </div>
            <ul class="nav-menu">
                <li><a href="/movies/">Movies</a></li>
                <li><a href="/accounts/login/">Login</a></li>
                <li><a href="/accounts/register/">Register</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-content">
        <div class="auth-container">
            <div class="auth-card">
                <h1>Login</h1>
                <form method="post" action="/accounts/login/" class="auth-form">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" name="username" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                
                <p class="auth-link">
                    Don't have an account? <a href="/accounts/register/">Register here</a>
                </p>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 Movie Booking System. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
