<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Movies - MyMovies Admin</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/admin.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🎬 MyMovies Admin</h1>
            <nav class="nav">
                <div class="nav-links">
                    <a href="index.html" class="nav-link">View Site</a>
                    <a href="admin.html" class="nav-link">Dashboard</a>
                    <a href="add-movie.html" class="nav-link">Add Movie</a>
                    <a href="manage-movies.html" class="nav-link active">Manage Movies</a>
                </div>
                <div class="nav-user">
                    <span class="user-info">
                        Welcome, <span id="userName">Admin</span> 
                        <small style="display: block; font-size: 0.8rem; opacity: 0.8;">Administrator</small>
                    </span>
                    <button class="btn btn-secondary" onclick="logout()">Logout</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="admin-header">
                <h1>Manage Movies</h1>
                <p>Edit or remove movies from your cinema</p>
            </div>

            <div class="admin-section">
                <div class="movies-grid" id="moviesList">
                    Movies will be loaded here
                 </div>
            </div>
        </div>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Check admin access
        if (!authSystem.isAdmin()) {
            window.location.href = 'index.html';
        }

        // Load and display movies

        function createMovieCard(movie) {
            const card = document.createElement('div');
            card.className = 'movie-card-admin';
            card.innerHTML = `
                <img src="${movie.posterUrl}" alt="${movie.title}" class="movie-poster-admin"
                     onerror="this.src='https://via.placeholder.com/200x300/CCCCCC/666666?text=No+Poster'">
                <div class="movie-info-admin">
                    <h4>${movie.title}</h4>
                    <p>${movie.genre} • ${movie.year}</p>
                    <p>⭐ ${movie.rating}/10 • ${movie.duration}</p>
                    <span class="status-badge status-${movie.status.replace('-', '-')}">
                        ${movie.status.replace('-', ' ')}
                    </span>
                    <div style="margin-top: 15px; display: flex; gap: 10px;">
                        <button class="btn btn-primary btn-small" onclick="editMovie('${movie.id}')">Edit</button>
                        <button class="btn btn-danger btn-small" onclick="deleteMovie('${movie.id}')">Delete</button>
                    </div>
                </div>
            `;
            return card;
        }

        function editMovie(movieId) {
            window.location.href = `edit-movie.html?movieId=${movieId}`;
        }

        function deleteMovie(movieId) {
            if (confirm('Are you sure you want to delete this movie? This action cannot be undone.')) {
                authSystem.deleteMovie(movieId);
                loadMovies();
                alert('Movie deleted successfully!');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadMovies();
            authSystem.updateUI();
        });
    </script>
</body>
</html>
