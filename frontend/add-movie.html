<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Movie - Admin</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">🎬 Add Movie - Admin</h1>
            <nav class="nav">
                <div class="nav-links">
                    <a href="index.html" class="nav-link">Back to Site</a>
                    <a href="manage-movies.html" class="nav-link">Manage Movies</a>
                </div>
                <div class="nav-user">
                    <span class="user-info">
                        Welcome, <span id="userName">Admin</span>
                    </span>
                    <button class="btn btn-secondary" onclick="logout()">Logout</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="form-container">
                <h1>Add New Movie</h1>
                <form id="addMovieForm" class="movie-form">
                    <div class="form-group">
                        <label for="title">Movie Title *</label>
                        <input type="text" id="title" name="title" required placeholder="Enter movie title">
                    </div>
                    
                    <div class="form-group">
                        <label for="posterUrl">Poster URL</label>
                        <input type="url" id="posterUrl" name="posterUrl" placeholder="https://example.com/poster.jpg">
                    </div>
                    
                    <div class="form-group">
                        <label for="status">Status *</label>
                        <select id="status" name="status" required>
                            <option value="">Select Status</option>
                            <option value="watched">Watched</option>
                            <option value="watching">Currently Watching</option>
                            <option value="want-to-watch">Want to Watch</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="rating">Rating (1-10)</label>
                        <input type="number" id="rating" name="rating" min="1" max="10" placeholder="Enter rating 1-10">
                    </div>
                    
                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="4" placeholder="Any notes about this movie..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Add Movie</button>
                    <a href="index.html" class="btn btn-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </main>

    <!-- Make sure storage.js is loaded FIRST -->
    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Simple logout function
        function logout() {
            localStorage.removeItem('currentUser');
            window.location.href = 'login.html';
        }
    </script>
    <!-- Then load the add movie script -->
    <script src="js/add-movie.js"></script>
</body>
</html>
