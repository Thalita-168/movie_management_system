<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management - Movies168</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/auth.css">
</head>
<body>
<header class="header">
    <div class="container">
        <h1 class="logo">🎬 MyMovies</h1>
        <nav class="nav">
            <div class="nav-links">
                <a href="index.html" class="nav-link">My Collection</a>
                <a href="mybookings.html" class="nav-link">My Bookings</a>
                <span id="adminLinks">
                    <a href="add-movie.html" class="nav-link">Add Movie</a>
                    <a href="user-management.html" class="nav-link active">Manage Users</a>
                </span>
            </div>
            <div class="nav-user">
                <span class="user-info" id="userInfo">
                    Welcome, <span id="userName">User</span> 
                </span>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>
        </nav>
    </div>
</header>

    <main class="main">
        <div class="container">
            <div class="user-management">
                <div class="admin-header">
                    <h1>User Management</h1>
                    <p>Manage all users and their permissions</p>
                </div>

                <!-- Stats Grid -->
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-info">
                            <h3 id="totalUsers">0</h3>
                            <p>Total Users</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🎬</div>
                        <div class="stat-info">
                            <h3 id="totalMovies">0</h3>
                            <p>Total Movies</p>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🎫</div>
                        <div class="stat-info">
                            <h3 id="totalBookings">0</h3>
                            <p>Total Bookings</p>
                        </div>
                    </div>
                </div>

                <!-- Users List -->
                <div class="users-grid" id="usersGrid">
                    <!-- Users will be loaded here -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/user-management.js"></script>
</body>
</html>
