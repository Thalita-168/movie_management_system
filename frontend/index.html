<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Movie Collection</title>
    <link rel="stylesheet" href="styles/style.css">
    <link rel="stylesheet" href="styles/responsive.css">
    <link rel="stylesheet" href="styles/receipt.css">
</head>
<body>
<header class="header">
    <div class="container">
        <h1 class="logo">🎬 MyMovies</h1>
        <nav class="nav">
            <div class="nav-links">
                <a href="index.html" class="nav-link">My Collection</a>
                <a href="mybookings.html" class="nav-link">My Bookings</a>
                <span id="adminLinks">
                    <a href="add-movie.html" class="nav-link">Add Movie</a>
                    <a href="user-management.html" class="nav-link active">Manage Users</a>
                </span>
            </div>
            <div class="nav-user">
                <span class="user-info" id="userInfo">
                    Welcome, <span id="userName">User</span> 
                </span>
                <button class="btn btn-secondary" onclick="logout()">Logout</button>
            </div>
        </nav>
    </div>
</header>

    <main class="main">
        <div class="container">
            <!-- Debug Info -->
            <div id="liveDebug" style="background: #f8f9fa; padding: 10px; border-radius: 5px; margin-bottom: 20px; font-size: 14px;">
                <strong>Live Debug Info:</strong>
                <div id="debugStatus">Loading...</div>
                <button onclick="refreshDebug()" class="btn btn-small" style="background: #3498db; color: white; margin-top: 5px;">Refresh Debug Info</button>
                <button onclick="clearAllData()" class="btn btn-small" style="background: #e74c3c; color: white; margin-top: 5px;">Clear All Data</button>
            </div>

            <!-- Stats Display -->
            <div class="stats-grid" id="statsDisplay">
                <!-- Stats will be loaded by JavaScript -->
            </div>

            <!-- Controls Section -->
            <section class="controls">
                <div class="search-bar">
                    <input type="text" id="searchInput" placeholder="Search movies..." class="search-input">
                    <button class="btn btn-primary" onclick="searchMovies()">Search</button>
                </div>
                
                <div class="filters">
                    <button class="filter-btn active" onclick="filterMovies('all', event)">All Movies</button>
                    <button class="filter-btn" onclick="filterMovies('watched', event)">Watched</button>
                    <button class="filter-btn" onclick="filterMovies('want-to-watch', event)">Want to Watch</button>
                </div>
                
                <a href="add-movie.html" class="btn btn-primary add-movie-btn">+ Add Movie</a>
            </section>

            <!-- Movies Grid -->
            <section class="movies-section">
                <h2 id="sectionTitle">My Collection</h2>
                <div class="movies-grid" id="moviesGrid">
                    <!-- Movies will be dynamically inserted here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Load all JavaScript files -->
<script>
// ===== UTILITY FUNCTIONS =====
function getCurrentUser() {
    return JSON.parse(localStorage.getItem('currentUser') || 'null');
}

function getUserMovies() {
    const currentUser = getCurrentUser();
    if (!currentUser) return [];
    
    // Check both storage systems for backward compatibility
    const userMovies = JSON.parse(localStorage.getItem('userMovies') || '{}');
    const globalMovies = JSON.parse(localStorage.getItem('movies') || '[]');
    
    // Priority: userMovies > globalMovies
    if (userMovies[currentUser.username]) {
        console.log('📀 Using user-specific movies');
        return userMovies[currentUser.username];
    } else if (globalMovies.length > 0) {
        console.log('📀 Using global movies array');
        return globalMovies;
    }
    
    return [];
}

function deleteUserMovie(movieId) {
    try {
        const currentUser = getCurrentUser();
        if (!currentUser) return false;
        
        const userMovies = JSON.parse(localStorage.getItem('userMovies') || '{}');
        const userMovieList = userMovies[currentUser.username] || [];
        
        // Filter out the movie to delete
        const updatedMovies = userMovieList.filter(movie => movie.id !== movieId);
        userMovies[currentUser.username] = updatedMovies;
        
        // Also check global movies
        const globalMovies = JSON.parse(localStorage.getItem('movies') || '[]');
        const updatedGlobalMovies = globalMovies.filter(movie => movie.id !== movieId);
        
        // Save both
        localStorage.setItem('userMovies', JSON.stringify(userMovies));
        localStorage.setItem('movies', JSON.stringify(updatedGlobalMovies));
        
        console.log('✅ Movie deleted:', movieId);
        return true;
    } catch (error) {
        console.error('❌ Error deleting movie:', error);
        return false;
    }
}

function updateUserMovie(movieId, updates) {
    try {
        const currentUser = getCurrentUser();
        if (!currentUser) return false;
        
        const userMovies = JSON.parse(localStorage.getItem('userMovies') || '{}');
        const userMovieList = userMovies[currentUser.username] || [];
        
        // Update the movie
        const updatedMovies = userMovieList.map(movie => 
            movie.id === movieId ? { ...movie, ...updates } : movie
        );
        
        userMovies[currentUser.username] = updatedMovies;
        localStorage.setItem('userMovies', JSON.stringify(userMovies));
        
        console.log('✅ Movie updated:', movieId, updates);
        return true;
    } catch (error) {
        console.error('❌ Error updating movie:', error);
        return false;
    }
}

// ===== DISPLAY FUNCTIONS =====
function displayPersonalMovies() {
    const currentUser = getCurrentUser();
    if (!currentUser) {
        console.log('No user logged in');
        showLoginPrompt();
        return;
    }

    const movies = getUserMovies();
    console.log('📀 Personal movies found:', movies.length);
    
    // Update the debug info
    updateDebugInfo(movies.length);
    
    // Display movies in the moviesGrid container
    displayMoviesInGrid(movies);
}

function displayMoviesInGrid(movies) {
    const container = document.getElementById('moviesGrid');
    
    if (!container) {
        console.log('❌ moviesGrid container not found');
        return;
    }
    
    console.log('🎯 Displaying movies in grid:', movies.length);
    
    if (movies.length === 0) {
        container.innerHTML = `
            <div class="no-movies" style="text-align: center; padding: 40px; grid-column: 1 / -1;">
                <h3>No movies in your collection yet</h3>
                <p>Start building your movie collection by adding your first movie!</p>
                <a href="add-movie.html" class="btn btn-primary" style="margin-top: 15px;">+ Add Your First Movie</a>
            </div>
        `;
        return;
    }
    
    container.innerHTML = movies.map(movie => `
        <div class="movie-card" data-movie-id="${movie.id}">
            <div class="movie-poster">
                ${movie.posterUrl ? 
                    `<img src="${movie.posterUrl}" alt="${movie.title}" style="width: 100%; height: 300px; object-fit: cover; border-radius: 8px;">` : 
                    '<div class="no-poster" style="width: 100%; height: 300px; background: #f0f0f0; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #666;">🎬 No Poster</div>'
                }
            </div>
            <div class="movie-info" style="padding: 15px;">
                <h3 class="movie-title" style="margin: 0 0 10px 0; color: #333;">${movie.title}</h3>
                <div class="movie-status ${movie.status}" style="display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8em; margin-bottom: 8px; background: ${movie.status === 'watched' ? '#d4edda' : '#fff3cd'}; color: ${movie.status === 'watched' ? '#155724' : '#856404'};">
                    ${movie.status === 'watched' ? '✅ Watched' : '📝 Want to Watch'}
                </div>
                ${movie.rating ? `<div class="movie-rating" style="color: #f39c12; margin: 8px 0;">Rating: ${'★'.repeat(movie.rating)}</div>` : ''}
                ${movie.notes ? `<p class="movie-notes" style="color: #666; font-style: italic; margin: 8px 0;">${movie.notes}</p>` : ''}
                <div class="movie-actions" style="margin-top: 15px; display: flex; gap: 10px;">
                    <button class="btn btn-small" onclick="markAsWatched('${movie.id}')" style="padding: 5px 10px; background: #3498db; color: white; border: none; border-radius: 4px; cursor: pointer;">Mark Watched</button>
                    <button class="btn btn-small btn-danger" onclick="deleteMovie('${movie.id}')" style="padding: 5px 10px; background: #e74c3c; color: white; border: none; border-radius: 4px; cursor: pointer;">Delete</button>
                </div>
            </div>
        </div>
    `).join('');
}

function showLoginPrompt() {
    const container = document.getElementById('moviesGrid');
    if (container) {
        container.innerHTML = `
            <div class="login-prompt" style="text-align: center; padding: 40px; grid-column: 1 / -1;">
                <h3>Please Log In</h3>
                <p>You need to be logged in to view your movie collection.</p>
                <a href="login.html" class="btn btn-primary">Login</a>
            </div>
        `;
    }
}

// ===== FILTER AND SEARCH FUNCTIONS =====
function filterMovies(filter, event) {
    // Update active filter button
    document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    
    const movies = getUserMovies();
    let filteredMovies = [];
    
    switch(filter) {
        case 'watched':
            filteredMovies = movies.filter(movie => movie.status === 'watched');
            document.getElementById('sectionTitle').textContent = 'Watched Movies';
            break;
        case 'want-to-watch':
            filteredMovies = movies.filter(movie => movie.status === 'want-to-watch');
            document.getElementById('sectionTitle').textContent = 'Want to Watch';
            break;
        default:
            filteredMovies = movies;
            document.getElementById('sectionTitle').textContent = 'My Collection';
    }
    
    displayMoviesInGrid(filteredMovies);
}

function searchMovies() {
    const searchTerm = document.getElementById('searchInput').value.toLowerCase();
    const movies = getUserMovies();
    
    const filteredMovies = movies.filter(movie => 
        movie.title.toLowerCase().includes(searchTerm) ||
        (movie.notes && movie.notes.toLowerCase().includes(searchTerm))
    );
    
    displayMoviesInGrid(filteredMovies);
}

// ===== DEBUG FUNCTIONS =====
function refreshDebug() {
    console.log('=== REFRESHING DEBUG INFO ===');
    
    const currentUser = getCurrentUser();
    const movies = getUserMovies();
    
    const debugStatus = document.getElementById('debugStatus');
    debugStatus.innerHTML = `
        👤 User: ${currentUser ? currentUser.username : 'Not logged in'} |
        📀 Movies: ${movies.length} |
        💾 Storage: ${localStorage.getItem('userMovies') ? 'userMovies' : 'movies'}
    `;
    
    console.log('👤 Current user:', currentUser);
    console.log('📀 Movies found:', movies);
    console.log('💾 All localStorage:', Object.keys(localStorage));
    
    // Force reload movies
    displayPersonalMovies();
}

function clearAllData() {
    if (confirm('Are you sure you want to clear ALL data? This will logout all users and delete all movies.')) {
        localStorage.clear();
        alert('All data cleared! Page will reload.');
        location.reload();
    }
}

function updateDebugInfo(movieCount) {
    const currentUser = getCurrentUser();
    const debugElement = document.getElementById('debugStatus');
    
    if (debugElement && currentUser) {
        debugElement.innerHTML = `User: ${currentUser.username} | Movies: ${movieCount} | Storage: ${localStorage.getItem('userMovies') ? 'userMovies' : 'movies'}`;
    }
}

// ===== MOVIE ACTIONS =====
function deleteMovie(movieId) {
    if (confirm('Are you sure you want to delete this movie?')) {
        const success = deleteUserMovie(movieId);
        if (success) {
            alert('Movie deleted!');
            displayPersonalMovies(); // Refresh display
        } else {
            alert('Failed to delete movie');
        }
    }
}

function markAsWatched(movieId) {
    const success = updateUserMovie(movieId, { status: 'watched' });
    if (success) {
        alert('Movie marked as watched!');
        displayPersonalMovies(); // Refresh display
    } else {
        alert('Failed to update movie');
    }
}

// ===== INITIALIZATION =====
document.addEventListener('DOMContentLoaded', function() {
    console.log('=== INDEX.HTML INITIALIZED ===');
    
    // Set up event listeners
    const searchInput = document.getElementById('searchInput');
    if (searchInput) {
        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchMovies();
            }
        });
    }
    
    // Update user info in header
    const currentUser = getCurrentUser();
    if (currentUser) {
        const userNameElement = document.getElementById('userName');
        if (userNameElement) {
            userNameElement.textContent = currentUser.username;
        }
        
        // Show/hide admin links
        const adminLinks = document.getElementById('adminLinks');
        if (adminLinks) {
            adminLinks.style.display = currentUser.role === 'admin' ? 'inline' : 'none';
        }
    }
    
    // Initial display
    setTimeout(function() {
        refreshDebug();
        displayPersonalMovies();
    }, 100);
});

// Simple logout function
function logout() {
    localStorage.removeItem('currentUser');
    window.location.href = 'login.html';
}
</script>

    <!-- Load external JavaScript files -->
    <script src="js/storage.js"></script>
    <script src="movies.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/movies-api.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
    <script src="js/receipt.js"></script>
    <script src="js/mybookings.js"></script>
</body>
</html>
