<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Movie - Movie Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles/style.css">
    <style>
        .form-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-group label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            display: block;
        }
        .form-control, .form-select {
            border-radius: 8px;
            padding: 0.75rem;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }
        .btn {
            border-radius: 8px;
            padding: 0.75rem 1.5rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-film me-2"></i>Movie Booking System
            </a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Home</a>
                <a class="nav-link" href="manage-movies.html">Manage Movies</a>
                <a class="nav-link" href="admin.html">Admin</a>
            </div>
        </div>
    </nav>

    <main class="main py-5">
        <div class="container">
            <div class="form-container">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h1><i class="fas fa-edit me-2"></i>Edit Movie</h1>
                    <a href="manage-movies.html" class="btn btn-outline-secondary">
                        <i class="fas fa-arrow-left me-1"></i> Back to Movies
                    </a>
                </div>
                
                <form id="editMovieForm" class="movie-form">
                    <input type="hidden" id="editMovieId" name="id">
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="editTitle">Movie Title *</label>
                                <input type="text" id="editTitle" name="title" class="form-control" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="editGenre">Genre *</label>
                                <input type="text" id="editGenre" name="genre" class="form-control" required 
                                       placeholder="Action, Adventure, Comedy, etc.">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="editDescription">Description *</label>
                        <textarea id="editDescription" name="description" class="form-control" rows="3" 
                                  placeholder="Movie plot summary..." required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="editDuration">Duration (minutes) *</label>
                                <input type="number" id="editDuration" name="duration" class="form-control" 
                                       min="60" max="240" required>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="editRating">Rating *</label>
                                <select id="editRating" name="rating" class="form-select" required>
                                    <option value="">Select Rating</option>
                                    <option value="G">G</option>
                                    <option value="PG">PG</option>
                                    <option value="PG-13">PG-13</option>
                                    <option value="R">R</option>
                                    <option value="NC-17">NC-17</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group">
                                <label for="editReleaseDate">Release Date *</label>
                                <input type="date" id="editReleaseDate" name="release_date" class="form-control" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="editPosterUrl">Poster Image URL *</label>
                                <input type="url" id="editPosterUrl" name="poster_url" class="form-control" 
                                       placeholder="https://example.com/poster.jpg" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="editTrailerUrl">Trailer URL (optional)</label>
                                <input type="url" id="editTrailerUrl" name="trailer_url" class="form-control" 
                                       placeholder="https://youtube.com/watch?v=...">
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="editIsActive" name="is_active" checked>
                            <label class="form-check-label" for="editIsActive">Movie is Active (visible to users)</label>
                        </div>
                    </div>

                    <div class="form-actions d-flex gap-2 justify-content-end">
                        <button type="button" class="btn btn-danger" onclick="deleteMovie()">
                            <i class="fas fa-trash me-1"></i> Delete Movie
                        </button>
                        <a href="manage-movies.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save me-1"></i> Update Movie
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Your scripts -->
    <script>
        const API_BASE_URL = 'http://localhost:5000/api';

        // Get movie ID from URL
        const urlParams = new URLSearchParams(window.location.search);
        const movieId = urlParams.get('id');

        // Load movie data when page loads
        document.addEventListener('DOMContentLoaded', function() {
            if (movieId) {
                loadMovieData(movieId);
            } else {
                alert('No movie ID specified');
                window.location.href = 'manage-movies.html';
            }
        });

        // Load movie data from API
        async function loadMovieData(movieId) {
            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/movies/${movieId}`, {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to load movie data');
                }

                const movie = await response.json();
                populateForm(movie);
                
            } catch (error) {
                console.error('Error loading movie:', error);
                alert('Error loading movie data: ' + error.message);
                window.location.href = 'manage-movies.html';
            }
        }

        // Populate form with movie data
        function populateForm(movie) {
            document.getElementById('editMovieId').value = movie.id;
            document.getElementById('editTitle').value = movie.title || '';
            document.getElementById('editDescription').value = movie.description || '';
            document.getElementById('editGenre').value = movie.genre || '';
            document.getElementById('editDuration').value = movie.duration || '';
            document.getElementById('editRating').value = movie.rating || '';
            document.getElementById('editPosterUrl').value = movie.poster_url || '';
            document.getElementById('editTrailerUrl').value = movie.trailer_url || '';
            document.getElementById('editIsActive').checked = movie.is_active !== false;
            
            // Format date for input field
            if (movie.release_date) {
                const releaseDate = new Date(movie.release_date);
                document.getElementById('editReleaseDate').value = releaseDate.toISOString().split('T')[0];
            }
        }

        // Handle form submission
        document.getElementById('editMovieForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const movieData = {
                title: formData.get('title'),
                description: formData.get('description'),
                genre: formData.get('genre'),
                duration: parseInt(formData.get('duration')),
                rating: formData.get('rating'),
                poster_url: formData.get('poster_url'),
                trailer_url: formData.get('trailer_url'),
                release_date: formData.get('release_date'),
                is_active: document.getElementById('editIsActive').checked
            };

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/admin/movies/${movieId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(movieData)
                });

                if (response.ok) {
                    alert('Movie updated successfully!');
                    window.location.href = 'manage-movies.html';
                } else {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to update movie');
                }
                
            } catch (error) {
                console.error('Error updating movie:', error);
                alert('Error updating movie: ' + error.message);
            }
        });

        // Delete movie function
        async function deleteMovie() {
            if (!confirm('Are you sure you want to delete this movie? This action cannot be undone.')) {
                return;
            }

            try {
                const token = localStorage.getItem('token');
                const response = await fetch(`${API_BASE_URL}/admin/movies/${movieId}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    alert('Movie deleted successfully!');
                    window.location.href = 'manage-movies.html';
                } else {
                    const error = await response.json();
                    throw new Error(error.message || 'Failed to delete movie');
                }
                
            } catch (error) {
                console.error('Error deleting movie:', error);
                alert('Error deleting movie: ' + error.message);
            }
        }

        // Check admin authentication
        function checkAdminAuth() {
            const token = localStorage.getItem('token');
            const user = localStorage.getItem('user');
            
            if (!token || !user) {
                window.location.href = 'login.html';
                return;
            }

            const userData = JSON.parse(user);
            if (userData.role !== 'admin') {
                alert('Access denied. Admin privileges required.');
                window.location.href = 'index.html';
            }
        }

        // Check auth on page load
        checkAdminAuth();
    </script>
</body>
</html>
